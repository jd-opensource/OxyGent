<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OxyBank - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-page">
        <div class="login-box">
            <h1>Oxy<span style="color:var(--primary)">Bank</span></h1>
            <p class="subtitle" data-i18n="login.subtitle">AI资产管理平台</p>
            <form id="loginForm">
                <div class="form-group">
                    <label data-i18n="login.username">用户名</label>
                    <input type="text" class="form-control" id="username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label data-i18n="login.password">密码</label>
                    <input type="password" class="form-control" id="password" required autocomplete="current-password">
                </div>
                <div class="form-group" id="loginError" style="display:none;">
                    <span style="color:var(--danger);font-size:13px;" data-i18n="login.error">用户名或密码错误</span>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px;" data-i18n="login.submit">登录</button>
            </form>
            <div style="text-align:center;">
                <div class="lang-toggle">
                    <button data-lang="zh">中文</button>
                    <button data-lang="en">EN</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/lib/jquery.min.js"></script>
    <script src="js/i18n.js"></script>
    <script>
        function redirectByRole(user) {
            const role = (user && user.role) || '';
            if (role === 'annotator') {
                window.location.href = '/annotation.html';
            } else {
                window.location.href = '/index.html';
            }
        }

        $(function() {
            i18n.apply();
            $('.lang-toggle').on('click', 'button', function() {
                i18n.setLang($(this).data('lang'));
            });

            if (localStorage.getItem('oxybank-token')) {
                let cachedUser = {};
                try { cachedUser = JSON.parse(localStorage.getItem('oxybank-user') || '{}'); } catch (e) {}
                redirectByRole(cachedUser);
                return;
            }

            $('#loginForm').on('submit', async function(e) {
                e.preventDefault();
                $('#loginError').hide();
                const username = $('#username').val().trim();
                const password = $('#password').val();
                try {
                    const resp = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({username, password}),
                    });
                    if (!resp.ok) {
                        $('#loginError').show();
                        return;
                    }
                    const data = await resp.json();
                    localStorage.setItem('oxybank-token', data.token);
                    localStorage.setItem('oxybank-user', JSON.stringify(data.user));
                    redirectByRole(data.user);
                } catch(err) {
                    $('#loginError').show();
                }
            });
        });
    </script>
</body>
</html>
